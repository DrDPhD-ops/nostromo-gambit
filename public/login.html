<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NOSTROMO GAMBIT — ДОСТУП</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23050a06'/><rect x='6' y='3' width='4' height='4' fill='%237dff9b'/><rect x='4' y='8' width='8' height='5' fill='%237dff9b'/></svg>"
    />
    <!--
      Стили встроены, а не взяты из theme.css: до входа шлюз отдаёт только эту
      страницу, остальная статика закрыта.
    -->
    <style>
      :root {
        --phosphor: #7dff9b;
        --phosphor-dim: #3d8a52;
        --phosphor-faint: #1c3d27;
        --amber: #ffb347;
        --alert: #ff4d4d;
        --bg: #050a06;
        --panel: #0a140c;
        --panel-edge: #16301c;
        --font: 'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--phosphor);
        font-family: var(--font);
        font-size: 14px;
        letter-spacing: 0.04em;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        text-shadow: 0 0 6px rgba(125, 255, 155, 0.35);
      }

      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      }

      .terminal {
        width: 100%;
        max-width: 440px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        box-shadow: 0 0 24px rgba(125, 255, 155, 0.08) inset;
        padding: 26px 26px 22px;
      }

      .title {
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 0.18em;
        margin: 0 0 4px;
      }

      .sub {
        color: var(--phosphor-dim);
        font-size: 12px;
        letter-spacing: 0.12em;
        margin: 0 0 22px;
      }

      .line {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.12em;
      }

      .line.amber {
        color: var(--amber);
        text-shadow: 0 0 6px rgba(255, 179, 71, 0.35);
      }

      label {
        display: block;
        margin: 18px 0 8px;
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--phosphor-dim);
      }

      .prompt {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--phosphor-dim);
        padding: 9px 11px;
      }

      .prompt:focus-within {
        border-color: var(--phosphor);
        box-shadow: 0 0 8px rgba(125, 255, 155, 0.25);
      }

      input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: none;
        color: var(--phosphor);
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.2em;
        caret-color: var(--phosphor);
      }

      button {
        width: 100%;
        margin-top: 16px;
        font-family: var(--font);
        font-size: 13px;
        letter-spacing: 0.16em;
        color: var(--phosphor);
        background: transparent;
        border: 1px solid var(--phosphor-dim);
        padding: 10px 11px;
        cursor: pointer;
        transition: background 120ms, box-shadow 120ms;
      }

      button:hover:not(:disabled) {
        background: rgba(125, 255, 155, 0.1);
        box-shadow: 0 0 8px rgba(125, 255, 155, 0.25);
      }

      button:disabled {
        color: var(--phosphor-faint);
        border-color: var(--phosphor-faint);
        cursor: wait;
      }

      .error {
        min-height: 1.4em;
        margin: 14px 0 0;
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--alert);
        text-shadow: 0 0 6px rgba(255, 77, 77, 0.4);
      }
    </style>
  </head>
  <body>
    <main class="terminal">
      <p class="title">NOSTROMO GAMBIT</p>
      <p class="sub">ТЕРМИНАЛ ЭКИПАЖА</p>

      <p class="line">&gt; СВЯЗЬ С БОРТОМ УСТАНОВЛЕНА</p>
      <p class="line amber">&gt; ДОСТУП ОГРАНИЧЕН</p>

      <form id="login">
        <label for="password">КОД ДОСТУПА</label>
        <div class="prompt">
          <span aria-hidden="true">&gt;</span>
          <input id="password" type="password" autocomplete="current-password" autofocus required />
        </div>
        <button id="submit" type="submit">[ ВОЙТИ ]</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </main>

    <script>
      const form = document.getElementById('login');
      const input = document.getElementById('password');
      const submit = document.getElementById('submit');
      const error = document.getElementById('error');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        submit.disabled = true;
        submit.textContent = '[ ПРОВЕРКА… ]';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input.value }),
          });
          if (res.ok) {
            window.location.href = '/';
            return;
          }
          const data = await res.json().catch(() => ({}));
          error.textContent = '> ' + (data.message || 'ОТКАЗАНО');
        } catch {
          error.textContent = '> НЕТ СВЯЗИ С БОРТОМ';
        }
        submit.disabled = false;
        submit.textContent = '[ ВОЙТИ ]';
        input.select();
      });
    </script>
  </body>
</html>
